name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Build React frontend ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Deploy frontend dist to EC2 ───────────────────────────────────────
      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          source: "frontend/dist/"
          target: "/home/ubuntu/options_dashboard/frontend/"
          strip_components: 1

      # ── Sync backend & restart API ────────────────────────────────────────
      - name: Pull latest code & restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            set -e
            cd /home/ubuntu/options_dashboard

            # Pull latest backend code
            git fetch origin main
            git reset --hard origin/main

            # Install any new Python dependencies
            venv/bin/pip install -r requirements.txt -q

            # Restart FastAPI backend
            sudo systemctl restart options-dashboard-api

            echo "Deploy complete at $(date)"

      # ── Write API key to .env on EC2 ─────────────────────────────────────
      - name: Write API key to EC2 .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            echo "ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}" > /home/ubuntu/options_dashboard/.env
            chmod 600 /home/ubuntu/options_dashboard/.env

      # ── Install daily fetch cron ──────────────────────────────────────────
      - name: Install daily fetch cron
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            mkdir -p /home/ubuntu/options_dashboard/logs

            # Write the daily fetch script
            cat > /home/ubuntu/options_dashboard/fetch_daily.sh << 'SCRIPT'
            #!/bin/bash
            set -e
            cd /home/ubuntu/options_dashboard
            source /home/ubuntu/options_dashboard/.env
            source venv/bin/activate

            # Fetch last 10 trading days for all tickers (catches any gaps)
            for TICKER in AMD AAPL NVDA TSLA AMZN MSFT META GOOGL NFLX INTC \
                          AVGO ORCL ARM PLTR SNOW SMCI TSM ADBE CRM NOW \
                          AAOI AXTI COHR FN LITE; do
              echo "=== $(date -u) Fetching $TICKER ==="
              python backfill_ticker_options.py $TICKER --fetch --limit 10 || true
              python backfill_ticker_options.py $TICKER --merge || true
            done

            echo "=== $(date -u) Daily fetch complete ==="
            SCRIPT

            chmod +x /home/ubuntu/options_dashboard/fetch_daily.sh

            # Install crontab entry (idempotent — removes old entry first)
            (crontab -l 2>/dev/null | grep -v fetch_daily; echo "0 6 * * 1-5 /home/ubuntu/options_dashboard/fetch_daily.sh >> /home/ubuntu/options_dashboard/logs/daily_fetch.log 2>&1") | crontab -

            echo "Cron installed:"
            crontab -l | grep fetch_daily
