name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Build React frontend ──────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Deploy frontend dist to EC2 ───────────────────────────────────────
      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          source: "frontend/dist/"
          target: "/home/ubuntu/options_dashboard/frontend/"
          strip_components: 1

      # ── Write API key to .env BEFORE restarting the API ──────────────────
      # Loaded by both the systemd service (EnvironmentFile) and the daily
      # cron script (set -a; source .env). Required for /api/tickers/probe
      # and /api/tickers/fetch to reach Alpha Vantage.
      - name: Write API key to EC2 .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            if [ -z "${{ secrets.ALPHAVANTAGE_API_KEY }}" ]; then
              echo "ERROR: ALPHAVANTAGE_API_KEY GitHub secret is empty or unset."
              echo "Add it at github.com/<org>/<repo>/settings/secrets/actions."
              exit 1
            fi
            echo "ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY }}" > /home/ubuntu/options_dashboard/.env
            chmod 600 /home/ubuntu/options_dashboard/.env

      # ── Sync backend code, install deps, install systemd unit, restart ──
      - name: Pull latest code & restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            set -e
            cd /home/ubuntu/options_dashboard

            git fetch origin main
            git reset --hard origin/main

            venv/bin/pip install -r requirements.txt -q

            # Sync the systemd unit file (picks up EnvironmentFile changes)
            sudo cp options-dashboard-api.service /etc/systemd/system/options-dashboard-api.service
            sudo systemctl daemon-reload
            sudo systemctl restart options-dashboard-api

            # Sync nginx config. Test syntax first so a typo can't take
            # the site down. nginx on this box has been started outside
            # systemd's tracking (PID file is empty, so `nginx -s reload`
            # and `systemctl reload nginx` both fail). Send SIGHUP
            # directly to the master process via pkill, falling back to
            # a hard restart if no master is alive.
            sudo cp nginx.conf /etc/nginx/sites-available/options-dashboard
            sudo ln -sf /etc/nginx/sites-available/options-dashboard /etc/nginx/sites-enabled/options-dashboard
            sudo nginx -t
            if pgrep -x nginx > /dev/null; then
              sudo pkill -HUP -x nginx
              echo "nginx reloaded via SIGHUP"
            else
              sudo nginx
              echo "nginx started (no master process was running)"
            fi
            sleep 1
            curl -fsS http://localhost/health > /dev/null && echo "nginx health check ok"

            # Sanity check: did the service come back up?
            sleep 2
            if ! systemctl is-active --quiet options-dashboard-api; then
              echo "FATAL: options-dashboard-api failed to start"
              sudo journalctl -u options-dashboard-api -n 30 --no-pager
              exit 1
            fi

            echo "Deploy complete at $(date)"

      # ── Install daily fetch cron (uses daily_options_update.sh) ──────────
      # Per-ticker smart fill: each night reads the parquet's lastDate and
      # fetches forward to today, capped at 90 trading days/run. Steady-
      # state cost: 1 AV call/ticker/night. Stale tickers recover gradually
      # over multiple nights.
      - name: Install daily fetch cron
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_DEPLOY_KEY }}
          script: |
            mkdir -p /home/ubuntu/options_dashboard/logs
            chmod +x /home/ubuntu/options_dashboard/daily_options_update.sh

            # Replace any prior cron entry; install the new one. 6 UTC = 1 AM
            # ET on weekdays — picks up previous trading day after AV's
            # overnight settlement.
            (
              crontab -l 2>/dev/null | grep -v 'daily_options_update\|fetch_daily' || true
              echo "0 6 * * 1-5 /home/ubuntu/options_dashboard/daily_options_update.sh >> /home/ubuntu/options_dashboard/logs/cron.log 2>&1"
            ) | crontab -

            # Remove the obsolete fetch_daily.sh (predecessor)
            rm -f /home/ubuntu/options_dashboard/fetch_daily.sh

            echo "Cron installed:"
            crontab -l | grep daily_options_update || echo "  (no entry)"
